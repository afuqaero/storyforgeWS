name: Deploy StoryForge browser converter
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Build static converter
        run: npm run build
      - name: Bundle FFmpeg core for reliable same-origin loading
        run: |
          mkdir -p dist/ffmpeg
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js dist/ffmpeg/
          cp node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm dist/ffmpeg/
          test -s dist/ffmpeg/ffmpeg-core.js
          test -s dist/ffmpeg/ffmpeg-core.wasm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
